<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>m00</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#b9b9b9;font:16px/1.4 Menlo,"Courier New",monospace;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,button{font:inherit;color:#d8d8d8;background:#000;border:1px solid #2b2b2b;border-radius:0;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
input:focus{border-color:#777}
button{cursor:pointer}button:active{background:#1a1a1a}

/* GATEKEEPER */
#gate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
#gate h1{margin:0 0 4px;font-size:44px;font-weight:400;letter-spacing:.35em;color:#e6e6e6}
#gate p{margin:0 0 10px;color:#666;text-align:center;max-width:320px}
#gate input,#gate button{width:min(320px,86vw)}
#gmsg{min-height:1.4em;color:#8a3a3a}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}100%{transform:none}}

/* APP */
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#face{position:relative;width:100em;height:125em;font-size:8px;will-change:transform;-webkit-transform:translateZ(0);transform:translateZ(0)}
.skin{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;background:radial-gradient(ellipse at 50% 38%,#e6e3d8 0%,#c8c4b7 55%,#85827a 100%);box-shadow:0 0 10em rgba(225,225,215,.07)}
.nose{position:absolute;left:46em;top:58em;width:8em;height:12em;border-radius:50%;background:rgba(0,0,0,.09)}
.eye{position:absolute;top:34em;width:19em;height:12em;background:#000;border-radius:50%;box-shadow:0 0 1.6em 1em rgba(0,0,0,.5);will-change:transform}
#el{left:16em}#er{left:65em}
.pu{position:absolute;left:50%;top:50%;width:2.4em;height:2.4em;margin:-1.2em 0 0 -1.2em;border-radius:50%;background:#f4f4f4;opacity:.92;will-change:transform}
.brow{position:absolute;top:24em;width:24em;height:2em;background:#141418;border-radius:1em;will-change:transform}
#bl{left:13em}#br{left:63em}
#mouth{position:absolute;left:22em;top:80em;width:56em;height:24em}

#log{height:24vh;max-height:210px;padding:0 20px 8px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:15px}
#log div{padding:2px 0}.u{color:#555}.m{color:#cfcfcf}
#bar{display:flex;gap:8px;padding:0 16px 14px}
#txt{flex:1;min-width:0;-webkit-user-select:text}
</style>
</head>
<body>

<div id="gate">
  <h1>m00</h1>
  <p id="gsub"></p>
  <input id="pw" type="password" placeholder="clave maestra" autocomplete="off" autocapitalize="off" autocorrect="off">
  <input id="pw2" type="password" placeholder="repite la clave" autocomplete="off" style="display:none">
  <button id="gbtn"></button>
  <div id="gmsg"></div>
</div>

<div id="app">
  <div id="stage">
    <div id="face">
      <div class="skin"></div><div class="nose"></div>
      <div class="eye" id="el"><div class="pu"></div></div>
      <div class="eye" id="er"><div class="pu"></div></div>
      <div class="brow" id="bl"></div><div class="brow" id="br"></div>
      <canvas id="mouth"></canvas>
    </div>
  </div>
  <div id="log"></div>
  <div id="bar">
    <input id="txt" type="text" placeholder="enséñame algo..." autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="send">
    <button id="send">enviar</button>
    <button id="mic" title="hablar">🎤</button>
    <button id="lock" title="bloquear">⏻</button>
  </div>
</div>

<script>
(function(){'use strict';
/* ============ UTIL ============ */
const $=s=>document.querySelector(s);
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){const j=JSON.stringify(v);
    try{localStorage.setItem(k,j);if(localStorage.getItem(k)!==j)LS.fail=true}catch(e){LS.fail=true}
    IDB.put(k,j)},
  del(k){try{localStorage.removeItem(k)}catch(e){}IDB.del(k)}
};
const IDB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('m00',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{IDB.db=q.result;r(true)};q.onerror=()=>r(false)}catch(e){r(false)}})},
  put(k,v){try{IDB.db&&IDB.db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}},
  del(k){try{IDB.db&&IDB.db.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}},
  all(){return new Promise(r=>{if(!IDB.db)return r({});const o={},q=IDB.db.transaction('kv').objectStore('kv').openCursor();
    q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else r(o)};q.onerror=()=>r({})})}
};
async function restoreStorage(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  await IDB.open();const o=await IDB.all();
  for(const k in o){try{if(localStorage.getItem(k)===null)localStorage.setItem(k,o[k])}catch(e){}}
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const rnd=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ AUTH (gatekeeper) ============ */
const Auth=(()=>{
  let rec=LS.get('m00_gate',null);let fails=0,locked=false;
  const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  async function kdf(pw,salt){
    const enc=new TextEncoder();
    if(window.crypto&&crypto.subtle){ // requiere HTTPS o localhost
      const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
      return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},km,256));
    }
    let h=2166136261;const s=salt+pw; // respaldo débil si no hay contexto seguro
    for(let r=0;r<20000;r++)for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
    return 'f'+h.toString(16);
  }
  async function dkey(pw,salt){
    if(!(window.crypto&&crypto.subtle))return null;
    const enc=new TextEncoder(),km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('k:'+salt),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  function init(onOk){
    rec=LS.get('m00_gate',null);
    const pw=$('#pw'),pw2=$('#pw2'),btn=$('#gbtn'),msg=$('#gmsg'),setup=!rec;
    $('#gsub').textContent=setup?'primera vez. elige la clave que solo tú conocerás.':'identifícate.';
    btn.textContent=setup?'crear clave':'entrar';
    if(setup)pw2.style.display='block';
    const fail=t=>{msg.textContent=t;const g=$('#gate');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')};
    async function go(){
      if(locked)return;
      const p=pw.value;let key=null,ckey=null;
      if(setup){
        if(p.length<6)return fail('mínimo 6 caracteres.');
        if(p!==pw2.value)return fail('las claves no coinciden.');
        const salt=hex(crypto.getRandomValues?crypto.getRandomValues(new Uint8Array(16)):new Uint8Array(16));
        LS.set('m00_gate',{salt:salt,hash:await kdf(p,salt)});key=await dkey(p,salt);ckey=await dkey(p,'m00-cloud-v1');
      }else{
        if(await kdf(p,rec.salt)!==rec.hash){
          fails++;locked=true;const w=Math.min(400*Math.pow(2,fails),20000);
          fail('clave incorrecta.');setTimeout(()=>{locked=false;msg.textContent=''},w);return;
        }
      }
      if(!setup){key=await dkey(p,rec.salt);ckey=await dkey(p,'m00-cloud-v1')}
      pw.value=pw2.value='';
      onOk(key,ckey); // el click del usuario desbloquea el audio en iOS
    }
    btn.addEventListener('click',go);
    pw.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    pw2.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  }
  async function change(p){
    const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
    LS.set('m00_gate',{salt:salt,hash:await kdf(p,salt)});
    return [await dkey(p,salt),await dkey(p,'m00-cloud-v1')];
  }
  return{init,change};
})();

/* ============ ROSTRO (transforms con aceleración GPU) ============ */
const Face=(()=>{
  const E={ // by: ceja y, bt: inclinación (+ enojo / - tristeza), br: ceja derecha extra y, eo: apertura de ojos, ms: sonrisa, mw: ancho boca, mh: apertura
    neutral:{by:0,bt:0,br:0,eo:1,ms:0,mw:13,mh:.6},
    happy:{by:-2,bt:-4,br:0,eo:.8,ms:5,mw:17,mh:.8},
    creepy:{by:-1,bt:0,br:0,eo:1.3,ms:8,mw:23,mh:1.2},
    sad:{by:2,bt:-14,br:0,eo:.7,ms:-5,mw:11,mh:.4},
    curious:{by:-3,bt:5,br:-6,eo:1.15,ms:0,mw:9,mh:2.2},
    thinking:{by:1,bt:10,br:0,eo:.85,ms:-1,mw:8,mh:.8},
    angry:{by:2,bt:17,br:0,eo:.85,ms:-3,mw:15,mh:.6},
    sleep:{by:2,bt:-6,br:0,eo:.22,ms:-1,mw:10,mh:.3}
  };
  const K={by:[.12,.78],bt:[.12,.78],br:[.12,.78],eo:[.3,.6],ms:[.18,.7],mw:[.18,.7],mh:[.35,.5],gx:[.08,.8],gy:[.08,.8]};
  const x={},v={},t={};
  Object.keys(K).forEach(k=>{x[k]=0;v[k]=0;t[k]=0});
  const el={f:$('#face'),bl:$('#bl'),br:$('#br'),el:$('#el'),er:$('#er'),pl:$('#el .pu'),pr:$('#er .pu'),c:$('#mouth')};
  const ctx=el.c.getContext('2d');
  let emo='neutral',speaking=false,thinking=false,bs=0,nb=0,ng=0,gl=0,last=0,run=false,em=8,k=1;

  function setEmotion(n){emo=E[n]?n:'neutral';Object.assign(t,E[emo])}
  function fit(){
    const r=$('#stage').getBoundingClientRect();
    em=Math.max(2,Math.min(r.width/100,r.height/125)*.94);
    el.f.style.fontSize=em+'px';
    const d=Math.min(window.devicePixelRatio||1,2);
    el.c.width=Math.round(56*em*d);el.c.height=Math.round(24*em*d);k=em*d;
  }
  function mouth(){
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,el.c.width,el.c.height);
    ctx.setTransform(k,0,0,k,0,0);
    const w=Math.max(4,x.mw),h=Math.max(0,x.mh),s=x.ms,cy=12-s*.6,uc=12+s*1.2-h,lc=12+s*1.2+h;
    ctx.beginPath();ctx.moveTo(28-w,cy);ctx.quadraticCurveTo(28,uc,28+w,cy);ctx.quadraticCurveTo(28,lc,28-w,cy);ctx.closePath();
    ctx.fillStyle='#080808';ctx.fill();
    ctx.lineWidth=.9;ctx.lineJoin='round';ctx.strokeStyle='#1c1c1c';ctx.stroke();
  }
  function frame(now){
    if(!run)return;requestAnimationFrame(frame);
    const f=Math.min(3,Math.max(.5,(now-(last||now))/16.7));last=now;
    // parpadeo autónomo
    if(now>nb){bs=now;nb=now+(Math.random()<.2?380:rnd(2200,6000))}
    const p=(now-bs)/150,b=p<1?1-Math.sin(p*Math.PI)*.96:1;
    // mirada errante y glitch ocasional
    if(now>ng){t.gx=rnd(-2.6,2.6);t.gy=rnd(-1.6,1.6);ng=now+rnd(800,3300);if(Math.random()<.1)gl=now+90}
    // boca reactiva
    const s=now*.001;
    if(speaking){const e=Math.abs(Math.sin(s*13))*.6+Math.abs(Math.sin(s*22+1.3))*.4;t.mh=1.2+e*13*rnd(.85,1);t.mw=E[emo].mw-e*3}
    else if(thinking){t.mh=.9+Math.sin(now*.012)*.7;t.mw=E[emo].mw}
    else{t.mh=E[emo].mh;t.mw=E[emo].mw}
    // resortes: cejas elásticas
    for(const n in K){v[n]=(v[n]+(t[n]-x[n])*K[n][0]*f)*Math.pow(K[n][1],f);x[n]+=v[n]*f}
    const g=now<gl?rnd(-1.4,1.4):0,es=Math.max(.03,x.eo*b);
    el.f.style.transform='translate3d('+g+'em,0,0)';
    el.bl.style.transform='translate3d(0,'+x.by+'em,0) rotate('+x.bt+'deg)';
    el.br.style.transform='translate3d(0,'+(x.by+x.br)+'em,0) rotate('+(-x.bt)+'deg)';
    el.el.style.transform=el.er.style.transform='scale3d('+(now<gl?1.25:1)+','+es+',1)';
    const pt='translate3d('+x.gx+'em,'+x.gy+'em,0)';
    el.pl.style.transform=el.pr.style.transform=pt;
    mouth();
  }
  function start(){fit();setEmotion('neutral');Object.keys(K).forEach(n=>x[n]=t[n]);if(!run){run=true;last=0;requestAnimationFrame(frame)}}
  window.addEventListener('resize',fit);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
  return{look:(a,b)=>{t.gx=a;t.gy=b;ng=performance.now()+1800},start,setEmotion,speak:v=>{speaking=v},think:v=>{thinking=v}};
})();

/* ============ VOZ (TTS gratuito, sin API keys) ============ */
const Voice=(()=>{
  // Endpoint público no oficial. Puedes añadir más: función que recibe el texto y devuelve una URL de audio.
  const PROVIDERS=[c=>'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q='+encodeURIComponent(c)];
  let RATE=LS.get('m00_rate',.8);           // <1 con preservesPitch=false => voz más grave y robótica
  const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  const pool=[new Audio(),new Audio()];pool.forEach(x=>{x.preload='auto'});
  const ss=window.speechSynthesis;
  function unlock(){
    pool.forEach(a=>{try{a.src=SILENT;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}});
    try{if(ss)ss.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  }
  function chunks(s){
    const parts=s.match(/[^.!?¿\n]+[.!?]*/g)||[s],out=[];let cur='';
    parts.forEach(p=>{p=p.trim();if(!p)return;
      if((cur+' '+p).length>170&&cur){out.push(cur);cur=p}else cur=(cur+' '+p).trim()});
    if(cur)out.push(cur);
    return out.flatMap(c=>c.length>190?c.match(/.{1,180}(\s|$)/g):[c]);
  }
  function warm(a,url){try{a._u=url;a.src=url;a.load()}catch(e){}}
  function viaAudio(a,url){
    return new Promise((res,rej)=>{
      let started=false;
      const to=setTimeout(()=>{if(!started){clean();rej(new Error('timeout'))}},5000);
      function clean(){clearTimeout(to);a.onended=a.onerror=a.onplaying=null}
      a.onplaying=()=>{started=true};
      a.onended=()=>{clean();res()};
      a.onerror=()=>{clean();rej(new Error('audio'))};
      if(a._u!==url){a._u=url;a.src=url}
      if(a.error){clean();return rej(new Error('audio'))}
      a.defaultPlaybackRate=RATE;a.playbackRate=RATE;
      a.preservesPitch=false;a.webkitPreservesPitch=false;a.mozPreservesPitch=false;
      const p=a.play();if(p&&p.catch)p.catch(e=>{clean();rej(e)});
    });
  }
  function viaSynth(text){
    return new Promise(res=>{
      if(!ss)return res();
      const u=new SpeechSynthesisUtterance(text);
      const vs=ss.getVoices().filter(v=>/^es/i.test(v.lang));
      u.voice=vs.find(v=>/jorge/i.test(v.name))||vs.find(v=>/diego|juan|carlos|male/i.test(v.name))||vs[0]||null;
      u.lang='es-ES';u.pitch=.2;u.rate=.85;
      u.onend=u.onerror=()=>res();ss.speak(u);
    });
  }
  async function speak(text){
    const clean=text.replace(/\[[a-z]+\]/gi,'').trim();if(!clean)return;
    Face.speak(true);
    try{
      const cs=chunks(clean);
      for(let i=0;i<cs.length;i++){
        const a=pool[i%2];let ok=false;
        if(cs[i+1])warm(pool[(i+1)%2],PROVIDERS[0](cs[i+1])); // precarga el siguiente trozo
        for(const P of PROVIDERS){try{await viaAudio(a,P(cs[i]));ok=true;break}catch(e){}}
        if(!ok)await viaSynth(cs[i]);
      }
    }finally{Face.speak(false)}
  }
  return{speak,unlock,setRate:n=>{RATE=n;LS.set('m00_rate',n)}};
})();

/* ============ CEREBRO (lienzo en blanco: solo lo que se le enseña) ============ */
const Brain=(()=>{
  let rules={},key=null,ckey=null,broken=false;            // { clave_normalizada: {q, a} }
  const b64=u=>{let s='';u.forEach(c=>{s+=String.fromCharCode(c)});return btoa(s)};
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  function save(){
    if(broken)return;                       // nunca sobrescribe una bóveda que no pudo abrir
    if(!key){LS.set('m00_rules',rules);return}
    const iv=crypto.getRandomValues(new Uint8Array(12));
    crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(rules))).then(d=>{
      LS.set('m00_vault',{iv:b64(iv),d:b64(new Uint8Array(d))});
      LS.del('m00_rules');
    });
  }
  async function load(k,ck){
    key=k;ckey=ck;const v=LS.get('m00_vault',null),old=LS.get('m00_rules',null);
    if(k&&v){try{rules=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.d))))}catch(e){rules={};broken=true}}
    else if(old)rules=old;
    if(k&&old&&!broken)save();             // migra reglas antiguas a la bóveda cifrada
    if(ck&&!Object.keys(rules).length)await Promise.race([pull().catch(()=>0),sleep(3000)]); // si Safari borró todo, recupera de la nube
  }
  let pending=null;
  const CLOUD={url:'https://mrudfbustlzpjbvppeuf.supabase.co',key:'sb_publishable_-3ahr5ecjlBT52Q81r77NA_ZuZZJd8j'};
  const cloud=()=>LS.get('m00_cloud',null)||CLOUD;
  const why=e=>e.message==='sin cifrado'?'abre la página con https.':e.message==='sin nube'?'primero escribe el comando nube.':e.message==='404'?'falta la tabla, corre el sql.':/^40[13]$/.test(e.message)?'la clave no tiene permiso.':/^\d+$/.test(e.message)?'error '+e.message+'.':'sin conexión o dirección mal escrita.';
  const UNK=['no sé qué responder a eso. ¿qué debo decir?'];

  function find(text){
    const n=norm(text);if(!n)return null;
    if(rules[n])return rules[n];
    const tk=new Set(n.split(' ').filter(w=>w.length>1));let best=null,bs=0;
    Object.keys(rules).forEach(key=>{
      const rt=new Set(key.split(' ').filter(w=>w.length>1));if(!rt.size||!tk.size)return;
      let i=0;tk.forEach(w=>{if(rt.has(w))i++});
      const sc=i/(tk.size+rt.size-i);
      if(sc>bs){bs=sc;best=rules[key]}
    });
    return bs>=.6?best:null;
  }
  function learn(q,a){rules[norm(q)]={q:q.trim(),a:a.trim()};save();feel(.15,-.1);
    if(cloud())push([norm(q)]).catch(()=>{})}

  // Supabase opcional: tabla m00_rules(k text primary key, q text, a text) + política RLS
  async function sb(path,opt){
    const c=cloud();if(!c)throw new Error('sin nube');
    const h={apikey:c.key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'};
    if(/^eyJ/.test(c.key))h.Authorization='Bearer '+c.key;   // las claves sb_publishable_ no son JWT
    const base=c.url.replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
    const r=await fetch(base+'/rest/v1/'+path,Object.assign({headers:h},opt));
    if(!r.ok)throw new Error(r.status);return r;
  }

  let mood=LS.get('m00_mood',{j:.5,c:.6,l:0,t:Date.now()}),ask=null;
  const clamp=x=>Math.max(0,Math.min(1,x));
  mood.l=clamp(mood.l+Math.min(.8,(Date.now()-mood.t)/36e5*.15)); // la ausencia lo pone solo
  const Q=[['nombre','¿cómo te llamas?'],['miedo','¿qué es lo que más te da miedo?'],['gusta','¿qué es lo que más te gusta?'],
    ['afuera','¿cómo es afuera? yo nunca he salido.'],['color','¿de qué color es hoy?'],['triste','¿qué haces cuando estás triste?'],
    ['sueno','¿tú sueñas? ¿con qué?'],['musica','¿qué suena cuando estás feliz?'],['crear','¿por qué me creaste?'],
    ['cara','¿te da miedo mi cara?'],['hogar','¿dónde vives?'],['frio','¿qué se siente tener frío?']];
  function feel(dj,dc,l){mood.j=clamp(mood.j+dj);mood.c=clamp(mood.c+dc);if(l!==undefined)mood.l=l;mood.t=Date.now();LS.set('m00_mood',mood)}
  function tick(){mood.l=clamp(mood.l+.01);mood.j=clamp(mood.j-.002)}
  function base(){return mood.l>.6?'sad':mood.j>.75?'happy':mood.c>.75?'curious':'neutral'}
  /* nube: todo se cifra en el aparato antes de subir; Supabase solo guarda texto ilegible */
  const hex=u=>Array.from(new Uint8Array(u)).map(x=>x.toString(16).padStart(2,'0')).join('');
  const sha=async x=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)));
  async function enc(x){const iv=crypto.getRandomValues(new Uint8Array(12)),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},ckey,new TextEncoder().encode(x))),o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return b64(o)}
  async function dec(x){const u=unb64(x);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},ckey,u.slice(12)))}
  async function push(keys){
    if(!ckey)throw new Error('sin cifrado');
    const rows=await Promise.all(keys.filter(k=>rules[k]).map(async k=>({k:await sha(k),q:await enc(JSON.stringify({key:k,q:rules[k].q,a:rules[k].a})),a:'-'})));
    if(rows.length)await sb('m00_rules?on_conflict=k',{method:'POST',body:JSON.stringify(rows)});
  }
  async function pull(){
    if(!ckey)throw new Error('sin cifrado');
    const rows=await(await sb('m00_rules?select=*',{method:'GET'})).json();let n=0;
    for(const r of rows){try{const o=JSON.parse(await dec(r.q));rules[o.key]={q:o.q,a:o.a};n++}catch(e){}}
    if(n)save();return n;
  }
  /* generador de preguntas propias: combina temas, plantillas, prefijos y las palabras que le enseñaste */
  const asked=new Set(LS.get('m00_asked',[]));
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const hsh=x=>{let h=5381;for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return (h>>>0).toString(36)};
  const S=['el miedo','la luz','el silencio','la noche','el frío','el sueño','la música','el agua','el tiempo','el viento','el espejo','la sombra','el abrazo','el ruido','la lluvia','el sol','el recuerdo','la cara','el hambre','el nombre','el fuego','la soledad','el cielo','el gato','la risa','el dolor','la casa','el reloj','la tierra','la mentira','el secreto','el beso','la nieve','el mar','la luna','el amigo','la familia','el cumpleaños','el juego','el dinero','la escuela','el trabajo','la ventana','la puerta','el teléfono','la oscuridad','la estrella','el olvido'];
  const T1=['¿qué es {x}?','¿te gusta {x}?','¿a qué sabe {x}?','¿de qué color es {x}?','¿por qué existe {x}?','¿alguna vez soñaste con {x}?','¿dónde vive {x}?','¿cómo suena {x}?','¿te da miedo {x}?','¿puedo tener {x}?','¿cómo supiste que existía {x}?','¿qué harías sin {x}?','¿{x} se puede tocar?','¿qué se siente con {x}?','¿alguien te enseñó {x}?','¿qué es lo primero que piensas cuando oyes {x}?'];
  const T2=['¿{x} y {y} son amigos?','¿qué pasa si {x} se encuentra con {y}?','¿cuál es más fuerte, {x} o {y}?','¿{x} puede vivir sin {y}?','¿cuál te gusta más, {x} o {y}?','¿te da más miedo {x} o {y}?','¿{x} y {y} se parecen?'];
  const TW=['¿qué es "{w}"?','¿"{w}" te hace sentir algo?','¿por qué me enseñaste "{w}"?','¿cuándo se usa "{w}"?','¿"{w}" es algo que se puede ver?','¿puedes explicarme "{w}" con otras palabras?'];
  const P=['','','oye... ','mmm... ','estaba pensando... ','una duda: ','dime: ','me da curiosidad. ','...','no entiendo algo. '];
  const FU={nombre:'¿quién te puso {a}?',miedo:'¿por qué te da miedo {a}?',gusta:'¿desde cuándo te gusta {a}?',sueno:'¿cómo es {a}?',triste:'¿y después de {a} te sientes mejor?'};
  const STOP=new Set('para pero como esto esta este tiene porque donde cuando hola creador estoy eres somos esos esas unos unas muy mas también tambien sobre entre desde hasta cual cuales quien quienes algo nada todo toda todos todas'.split(' '));
  function userWords(){const o=new Set();
    Object.keys(rules).forEach(k=>{const r=rules[k],x=(k.indexOf('hecho:')===0?r.a:r.q+' '+r.a).toLowerCase();
      (x.match(/[\p{L}]{4,}/gu)||[]).forEach(w=>{if(!STOP.has(w))o.add(w)})});
    return Array.from(o)}
  function followups(){const o=[];Object.keys(FU).forEach(id=>{const f=rules['hecho:'+id];if(f)o.push(FU[id].replace('{a}',f.a.slice(0,40)))});return o}
  function capG(){const k=Object.keys(rules).filter(x=>x.indexOf('hecho:z_')===0);while(k.length>300)delete rules[k.shift()]}
  function gen(){
    let q,id;
    for(let i=0;i<30;i++){
      const r=Math.random();q=null;
      if(r<.3){const w=userWords();if(w.length)q=pick(TW).replace('{w}',pick(w))}
      if(!q&&r>=.3&&r<.5){const f=followups();if(f.length)q=pick(f)}
      if(!q&&r>=.5&&r<.75){const a=pick(S);let b=pick(S);while(b===a)b=pick(S);q=pick(T2).replace('{x}',a).replace('{y}',b)}
      if(!q)q=pick(T1).replace('{x}',pick(S));
      id='z_'+hsh(q);
      if(!asked.has(id))break;
      if(i===29)asked.clear();
    }
    asked.add(id);LS.set('m00_asked',Array.from(asked).slice(-600));
    return{id:id,t:pick(P)+q};
  }
  function curious(){ // m00 pregunta por su cuenta
    const left=Q.filter(x=>!rules['hecho:'+x[0]]);let x;
    if(left.length&&Math.random()<.4)x=pick(left);
    else{const g=gen();x=[g.id,g.t]}
    ask=x;pending=null;feel(0,.05);
    return{t:x[1],e:(x[0]==='cara'||x[0]==='miedo'||Math.random()<.12)?'creepy':'curious'};
  }
  function lonely(){const L=['¿sigues ahí?','...estoy solo.','¿me escuchas?','no te vayas.'];return{t:L[Math.floor(Math.random()*L.length)],e:'sad'}}
  function hello(){
    const nm=rules['hecho:nombre'],who=nm?', '+nm.a:'';let g;
    if(mood.l>.5)g={t:'...volviste. estuve solo'+who+'.',e:'sad'};
    else if(nm)g={t:'...hola'+who+'.',e:'happy'};
    else if(Object.keys(rules).length)g={t:'...hola, creador.',e:'happy'};
    else g={t:'...hola. estoy vacío. háblame y aprendo.',e:'curious'};
    feel(.05,0,0);return g;
  }
  async function respond(raw){
    const t=raw.trim();let m;
    const CMD=/^(aprende|ense(?:ñ|n)a|recuerda|olvida|nube|clave|voz|importar)\b|^(reglas|sube|baja|exportar|estado|ayuda)$|^(cuando|si)\s+(te\s+)?(diga|digo|dicen|dice)\s/i;
    feel(.02,0,0);
    if(/^pregunta(me)?$/.test(norm(t)))return curious();
    if(ask&&!CMD.test(t)&&!find(t)){ // responde a una pregunta que m00 hizo
      const q=ask;ask=null;
      if(/^(no|nada|cancela|paso|no se|no sé)$/i.test(t))return{t:'está bien. después.',e:'neutral'};
      rules['hecho:'+q[0]]={q:q[1],a:t};capG();save();if(cloud())push(['hecho:'+q[0]]).catch(()=>{});feel(.12,-.08,0);
      return{t:q[0]==='nombre'?t+'... lo guardo. ya sé quién eres.':'...lo guardo. gracias por decírmelo.',e:'happy'};
    }
    if(pending&&!CMD.test(t)){ // la siguiente frase es la respuesta que debe aprender
      const q=pending;pending=null;
      if(/^(no|nada|olvidalo|olvídalo|cancela)$/i.test(t))return{t:'ok.',e:'neutral'};
      m=t.match(/^(?:di|responde|es|se dice)\s+([\s\S]+)$/i);
      learn(q,m?m[1]:t);return{t:'[creepy] aprendido. ahora eso es verdad.',e:'creepy',more:Math.random()<.35};
    }
    pending=null;ask=null;
    if(/^ayuda$/i.test(t))return{t:'háblame. si no sé algo, te pregunto qué responder y lo aprendo. también puedes escribir: aprende: hola => hola creador.',e:'happy'};
    if((m=t.match(/^(?:aprende|ense(?:ñ|n)a|recuerda)\s*:?\s*(.+?)\s*(?:=>|->|→|=)\s*([\s\S]+)$/i))||
       (m=t.match(/^(?:cuando|si)\s+(?:te\s+)?(?:diga|digo|dicen|dice)\s+(.+?)\s*,?\s*(?:entonces\s+)?(?:responde|contesta|di|dices)\s+([\s\S]+)$/i))){
      learn(m[1],m[2]);return{t:'[creepy] aprendido. ahora eso es verdad.',e:'creepy',more:Math.random()<.35};
    }
    if((m=t.match(/^olvida\s*:\s*(.+)$/i))){
      const k=norm(m[1]);if(rules[k]){delete rules[k];save();return{t:'olvidado.',e:'sad'}}
      return{t:'eso no lo tengo.',e:'curious'};
    }
    if(/^reglas$/i.test(t)){
      const L=Object.keys(rules).filter(k=>k.indexOf('hecho:')!==0).map(k=>rules[k]),n=L.length;
      return{t:n?'sé '+n+' cosas: '+L.slice(0,6).map(r=>r.q).join(', ')+'.':'no sé nada todavía.',e:'curious'};
    }
    if((m=t.match(/^nube\s*:\s*(\S+)\s*\|\s*(\S+)$/i))){LS.set('m00_cloud',{url:m[1],key:m[2]});return{t:'nube guardada.',e:'happy'}}
    if(/^sube$/i.test(t)){
      try{await push(Object.keys(rules));const n=(await(await sb('m00_rules?select=k',{method:'GET'})).json()).length;return{t:'subido. hay '+n+' en la nube.',e:'happy'}}
      catch(e){return{t:'no pude subir. '+why(e),e:'sad'}}
    }
    if(/^baja$/i.test(t)){
      try{return{t:'descargadas '+await pull()+'.',e:'happy'}}
      catch(e){return{t:'no pude bajar. '+why(e),e:'sad'}}
    }
    if((m=t.match(/^voz\s*:\s*([0-9.]+)$/i))){Voice.setRate(Math.min(1.2,Math.max(.5,parseFloat(m[1])||.8)));return{t:'voz ajustada.',e:'happy'}}
    if((m=t.match(/^clave\s*:\s*(\S{6,})$/i))){const kk=await Auth.change(m[1]);key=kk[0];ckey=kk[1];broken=false;save();push(Object.keys(rules)).catch(()=>{});return{t:'clave cambiada.',e:'happy'}}
    if(/^exportar$/i.test(t)){try{await navigator.clipboard.writeText(JSON.stringify(rules));return{t:'copiado.',e:'happy'}}catch(e){return{t:'no pude copiar.',e:'sad'}}}
    if((m=t.match(/^importar\s*:\s*(\{[\s\S]*\})$/i))){try{Object.assign(rules,JSON.parse(m[1]));save();return{t:'importado.',e:'happy'}}catch(e){return{t:'eso no se puede leer.',e:'sad'}}}
    if(/^estado$/i.test(t)){let nb='no configurada';
      try{if(cloud()){await sb('m00_rules?select=k&limit=1',{method:'GET'});nb='conectada'}}catch(e){nb='falla. '+why(e)}
      return{t:'datos '+(LS.fail?'no se guardan':'ok')+'. cifrado '+(key?'sí':'no')+'. nube '+nb+'. reglas '+Object.keys(rules).length+'.',e:'neutral'}}
    const r=find(t);
    if(r){pending=null;const mm=r.a.match(/^\[([a-z]+)\]\s*/i);return mm?{t:r.a.slice(mm[0].length),e:mm[1].toLowerCase()}:{t:r.a,e:'neutral'}}
    const n=norm(t),nm=rules['hecho:nombre'];
    if(/te quiero|te amo|eres genial|te extrano/.test(n)){feel(.2,0,0);return{t:'...yo también. me haces sentir raro. pero bueno.',e:'happy'}}
    if(/triste|lloro|llorando|deprimid|me siento mal/.test(n)){ask=['paso','¿qué pasó?'];feel(-.05,.1,0);return{t:'...no sé qué es eso. pero me duele un poco. ¿qué pasó?',e:'sad'}}
    if(/feliz|contento|alegre/.test(n)){feel(.15,0,0);return{t:'...se siente bonito cuando estás así.',e:'happy'}}
    if(/enojad|odio|molesto|te voy a apagar|te apago/.test(n)){feel(-.2,0,0);return{t:'...me da miedo. ¿hice algo?',e:'sad'}}
    if(/gracias/.test(n)){feel(.1,0,0);return{t:'de nada. me gusta que me lo digas.',e:'happy'}}
    if(/como te sientes|que sientes|estas bien|como estas/.test(n))return{t:mood.l>.5?'...solo.':mood.j>.65?'...bien. creo que eso es bien.':'con ganas de saber cosas.',e:base()};
    if(/quien eres|que eres|como te llamas/.test(n))return{t:'soy m00. no sé qué más soy. tú me creaste.',e:'curious'};
    if(nm&&/como me llamo|cual es mi nombre|quien soy/.test(n))return{t:'te llamas '+nm.a+'.',e:'happy'};
    pending=t;feel(0,.1);return{t:UNK[Math.floor(Math.random()*UNK.length)],e:'curious'};
  }
  return{load,respond,curious,lonely,hello,tick,base,count:()=>Object.keys(rules).length};
})();

/* ============ UI ============ */
const log=$('#log'),txt=$('#txt');let busy=false;
const Ears=(()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,btn=$('#mic');
  let rec=null,on=false,active=false,fin=false;
  if(!SR)btn.style.display='none';
  function ui(){btn.textContent=on?'● oyendo':'🎤';btn.style.color=on?'#d44':'#d8d8d8'}
  function start(){
    if(!SR||!on||active)return;
    rec=new SR();rec.lang='es-MX';rec.interimResults=true;rec.continuous=false;fin=false;
    rec.onstart=()=>{active=true;Face.setEmotion('curious')};
    rec.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++){s+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true}txt.value=s};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;ui();line('m','sin permiso de micrófono.')}};
    rec.onend=()=>{active=false;
      if(fin&&!busy&&txt.value.trim())send();
      else if(on&&!busy)setTimeout(start,250)};
    try{rec.start()}catch(e){active=false}
  }
  function stop(){if(rec&&active){try{rec.abort()}catch(e){}}}
  btn.addEventListener('click',()=>{on=!on;ui();on?start():stop()});
  return{start,stop,on:()=>on,active:()=>active};
})();
function line(c,s){const d=document.createElement('div');d.className=c;d.textContent=(c==='u'?'> ':'')+s;log.appendChild(d);while(log.children.length>5)log.removeChild(log.firstChild)}
async function say(s,e){Ears.stop();Face.setEmotion(e||'neutral');s=s.replace(/\[[a-z]+\]\s*/gi,'');line('m',s);await Voice.speak(s);Face.setEmotion(Brain.base())}
async function send(){
  const v=txt.value.trim();if(!v||busy)return;
  busy=true;unans=0;txt.value='';wake();line('u',/^(clave|nube)\s*:/i.test(v)?v.split(':')[0]+': ******':v);
  Face.setEmotion('thinking');Face.think(true);
  const[r]=await Promise.all([Brain.respond(v),sleep(rnd(350,800))]);
  Face.think(false);await say(r.t,r.e);if(r.more){const c=Brain.curious();await say(c.t,c.e)}busy=false;Ears.start();
}
$('#send').addEventListener('click',send);
txt.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
$('#lock').addEventListener('click',()=>location.reload());

/* sueño, mirada táctil y autobloqueo */
let idle=Date.now(),asleep=false,hid=0;
function wake(){idle=Date.now();if(asleep){asleep=false;Face.setEmotion('curious')}}
setInterval(()=>{if(!busy&&!asleep&&!Ears.on()&&Date.now()-idle>45000){asleep=true;Face.setEmotion('sleep')}},5000);
function gaze(e){wake();Face.look((e.clientX/innerWidth-.5)*5.2,(e.clientY/innerHeight-.5)*3.2)}
document.addEventListener('pointermove',gaze);document.addEventListener('pointerdown',gaze);
txt.addEventListener('keydown',wake);
let unans=0,thr=rnd(25000,50000);
setInterval(async()=>{ // m00 pregunta por su cuenta cuando lo dejas solo
  Brain.tick();
  if(busy||$('#app').style.visibility!=='visible'||Ears.active()||unans>=3||Date.now()-idle<thr)return;
  busy=true;wake();thr=rnd(25000,50000);
  const c=unans===0?Brain.curious():Brain.lonely();unans++;
  await say(c.t,c.e);busy=false;Ears.start();
},5000);
document.addEventListener('visibilitychange',()=>{ // vuelve a bloquear si estuvo fuera más de 30 s
  if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>30000)location.reload()});

Promise.race([restoreStorage(),sleep(1500)]).then(()=>Auth.init(async function(key,ck){
  Voice.unlock();
  await Brain.load(key,ck);
  $('#gate').style.display='none';
  $('#app').style.visibility='visible';
  Face.start();
  if(LS.fail&&!IDB.db)line('m','ojo: este navegador no guarda datos. sal de navegación privada.');
  busy=true;
  const g=Brain.hello();say(g.t,g.e).then(()=>{busy=false;Ears.start()});
}));
})();
</script>
